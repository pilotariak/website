---

name: Design System / Lint

on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "src/styles/global.css"
      - "preview.html"
      - "hack/gen-design-tokens.py"
      - ".github/workflows/design-lint.yml"
  push:
    branches:
      - main
    paths:
      - "DESIGN.md"
      - "src/styles/global.css"
      - "preview.html"
      - "hack/gen-design-tokens.py"
      - ".github/workflows/design-lint.yml"

permissions:
  contents: read

jobs:
  lint-design:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Lint DESIGN.md against the design.md standard
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md

      - name: Verify global.css tokens are in sync with DESIGN.md
        run: |
          python3 -m pip install --quiet pyyaml
          python3 hack/gen-design-tokens.py --check
