      <rect x="488" y="104" width="24" height="12" rx="2" fill="#f7f4ef"/>
      <text x="500" y="113" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP</text>

