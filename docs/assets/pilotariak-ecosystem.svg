      <path d="M164,156 V204 Q164,212 172,212 H340 Q348,212 348,220 V268" fill="none" stroke="#141414" stroke-width="1.2" marker-end="url(#arrow-ink)"/>

      <!-- azkena → frontis (GraphQL query, ink) -->
      <path d="M612,156 V204 Q612,212 604,212 H476 Q468,212 468,220 V268" fill="none" stroke="#141414" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
