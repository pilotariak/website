<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pilotariak-ecosystem-title pilotariak-ecosystem-desc">
      <title id="pilotariak-ecosystem-title">Pilotariak Ecosystem Architecture</title>
      <desc id="pilotariak-ecosystem-desc">Architecture map of the Pilotariak Basque-pelota platform: the Kancha mobile app and Azkena MCP server query the central Frontis GraphQL gateway, while the Xilo Slack bot reaches the platform through Azkena's MCP tools. Frontis fans out to six private subgraphs over a Cloudflare D1 and KV store; a scheduler scrapes results into the store and Plaza publishes to AT Protocol for planned firehose indexing.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a7a7a"/></marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#141414"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c8102e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f4ef"/>

