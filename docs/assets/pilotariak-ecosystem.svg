      <text x="268" y="249" fill="#7a7a7a" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CORE</text>

      <rect x="48" y="452" width="904" height="128" rx="8" fill="#141414" fill-opacity="0.02" stroke="#e5ded6" stroke-width="1"/>
      <rect x="56" y="456" width="128" height="12" rx="2" fill="#f7f4ef"/>
      <text x="60" y="465" fill="#7a7a7a" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SOURCES &amp; DATA</text>

