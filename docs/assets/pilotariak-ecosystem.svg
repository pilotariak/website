      <rect x="700" y="404" width="52" height="12" rx="2" fill="#f7f4ef"/>
      <text x="704" y="413" fill="#7a7a7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PERSIST</text>

