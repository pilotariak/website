<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <style>
    text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <defs>
    <marker id="arr-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#141414"/>
    </marker>
    <marker id="arr-muted" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f7f4ef"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#141414" letter-spacing="-0.02em">Pilotariak — Infrastructure</text>

  <!-- ===== EXTERNAL zone ===== -->
  <rect x="20" y="46" width="1160" height="92" rx="8" fill="#f2ede7" stroke="#e5ded6" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="36" y="66" font-size="10" font-weight="700" fill="#7a7a7a" letter-spacing="1.5">EXTERNAL</text>
  <!-- Slack -->
  <rect x="250" y="58" width="190" height="64" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="345" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Slack</text>
  <text x="345" y="104" text-anchor="middle" font-size="11" fill="#7a7a7a">Events API · Slash Commands</text>
  <!-- AI Clients -->
  <rect x="470" y="58" width="190" height="64" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="565" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">AI Clients</text>
  <text x="565" y="104" text-anchor="middle" font-size="11" fill="#7a7a7a">Claude · Cursor · MCP hosts</text>

  <!-- ===== CLOUDFLARE zone ===== -->
  <rect x="20" y="152" width="1160" height="380" rx="10" fill="#141414" fill-opacity="0.02" stroke="#e5ded6" stroke-width="1.5"/>
  <rect x="20" y="152" width="150" height="24" rx="8" fill="#141414"/>
  <text x="95" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#f7f4ef">☁ Cloudflare</text>

  <!-- WORKERS row -->
  <text x="36" y="196" font-size="10" font-weight="700" fill="#7a7a7a" letter-spacing="1.2">WORKERS</text>
  <!-- Website -->
  <rect x="40" y="204" width="190" height="84" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="135" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Website</text>
  <text x="135" y="257" text-anchor="middle" font-size="11" fill="#7a7a7a">Worker · Astro SSG</text>
  <text x="135" y="272" text-anchor="middle" font-size="10" fill="#a8a49e">Static · No bindings</text>
  <!-- Xilo -->
  <rect x="250" y="204" width="190" height="84" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="345" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Xilo</text>
  <text x="345" y="257" text-anchor="middle" font-size="11" fill="#7a7a7a">Worker · Slack Bot</text>
  <text x="345" y="272" text-anchor="middle" font-size="10" fill="#a8a49e">Workers AI · Queues</text>
  <!-- Azkena -->
  <rect x="470" y="204" width="190" height="84" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <rect x="480" y="214" width="60" height="18" rx="5" fill="#141414"/>
  <text x="510" y="227" text-anchor="middle" font-size="9" font-weight="700" fill="#f7f4ef">MCP</text>
  <text x="565" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Azkena</text>
  <text x="565" y="269" text-anchor="middle" font-size="11" fill="#7a7a7a">Worker · MCP server</text>
  <!-- Frontis (FOCAL) -->
  <rect x="690" y="204" width="270" height="84" rx="8" fill="#c8102e" fill-opacity="0.08" stroke="#c8102e" stroke-width="1.5"/>
  <rect x="700" y="214" width="72" height="18" rx="5" fill="#c8102e"/>
  <text x="736" y="227" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">GATEWAY</text>
  <text x="825" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Frontis</text>
  <text x="825" y="269" text-anchor="middle" font-size="11" fill="#7a7a7a">Worker · GraphQL Federation · /graphql</text>

  <!-- PLATFORM SERVICES -->
  <text x="36" y="320" font-size="10" font-weight="700" fill="#7a7a7a" letter-spacing="1.2">PLATFORM SERVICES</text>
  <rect x="250" y="328" width="190" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <rect x="264" y="342" width="9" height="30" rx="2" fill="#7a7a7a" fill-opacity="0.4"/>
  <rect x="278" y="342" width="9" height="30" rx="2" fill="#7a7a7a" fill-opacity="0.6"/>
  <rect x="292" y="342" width="9" height="30" rx="2" fill="#7a7a7a" fill-opacity="0.85"/>
  <text x="375" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#141414">Queues</text>
  <text x="375" y="377" text-anchor="middle" font-size="11" fill="#7a7a7a">Cloudflare Queues</text>
  <text x="375" y="390" text-anchor="middle" font-size="10" fill="#a8a49e">Async job processing</text>

  <!-- SUBGRAPH WORKERS -->
  <text x="470" y="320" font-size="10" font-weight="700" fill="#7a7a7a" letter-spacing="1.2">SUBGRAPH WORKERS</text>
  <!-- echo -->
  <rect x="470" y="328" width="100" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="520" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#141414">echo</text>
  <text x="520" y="375" text-anchor="middle" font-size="10" fill="#7a7a7a">Health · Version</text>
  <!-- categories -->
  <rect x="588" y="328" width="100" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="638" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#141414">categories</text>
  <text x="638" y="373" text-anchor="middle" font-size="10" fill="#7a7a7a">Category</text>
  <text x="638" y="386" text-anchor="middle" font-size="9" fill="#a8a49e">@key: id</text>
  <!-- clubs -->
  <rect x="706" y="328" width="100" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="756" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#141414">clubs</text>
  <text x="756" y="373" text-anchor="middle" font-size="10" fill="#7a7a7a">Club</text>
  <text x="756" y="386" text-anchor="middle" font-size="9" fill="#a8a49e">@key: id</text>
  <!-- competitions -->
  <rect x="824" y="328" width="100" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="874" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#141414">competitions</text>
  <text x="874" y="373" text-anchor="middle" font-size="10" fill="#7a7a7a">Competition</text>
  <text x="874" y="386" text-anchor="middle" font-size="9" fill="#a8a49e">@key: id</text>
  <!-- results -->
  <rect x="942" y="328" width="100" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="992" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#141414">results</text>
  <text x="992" y="373" text-anchor="middle" font-size="10" fill="#7a7a7a">Result</text>
  <text x="992" y="386" text-anchor="middle" font-size="9" fill="#a8a49e">@key: id</text>
  <!-- specialties -->
  <rect x="1060" y="328" width="100" height="72" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <text x="1110" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#141414">specialties</text>
  <text x="1110" y="373" text-anchor="middle" font-size="10" fill="#7a7a7a">Specialty</text>
  <text x="1110" y="386" text-anchor="middle" font-size="9" fill="#a8a49e">@key: id</text>

  <!-- DATABASE -->
  <text x="470" y="430" font-size="10" font-weight="700" fill="#7a7a7a" letter-spacing="1.2">DATABASE</text>
  <rect x="470" y="438" width="690" height="70" rx="8" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <ellipse cx="502" cy="460" rx="14" ry="6" fill="#e5ded6" stroke="#a8a49e" stroke-width="1"/>
  <rect x="488" y="460" width="28" height="22" fill="#f2ede7" stroke="none"/>
  <ellipse cx="502" cy="482" rx="14" ry="6" fill="#e5ded6" stroke="#a8a49e" stroke-width="1"/>
  <line x1="488" y1="460" x2="488" y2="482" stroke="#a8a49e" stroke-width="1"/>
  <line x1="516" y1="460" x2="516" y2="482" stroke="#a8a49e" stroke-width="1"/>
  <text x="700" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">D1 · KV</text>
  <text x="700" y="483" text-anchor="middle" font-size="11" fill="#7a7a7a">Cloudflare D1 (SQLite) · KV supergraph cache</text>
  <text x="700" y="497" text-anchor="middle" font-size="10" fill="#a8a49e">Bound to subgraph workers · one DB per league</text>

  <!-- ===== ARROWS ===== -->
  <!-- Slack -> Xilo (webhook, request) -->
  <line x1="345" y1="122" x2="345" y2="204" stroke="#141414" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="349" y="152" width="80" height="16" rx="3" fill="#f7f4ef"/>
  <text x="389" y="164" text-anchor="middle" font-size="10" fill="#141414">webhook event</text>
  <!-- AI Clients -> Azkena (MCP, request) -->
  <line x1="565" y1="122" x2="565" y2="204" stroke="#141414" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="569" y="154" width="34" height="16" rx="3" fill="#f7f4ef"/>
  <text x="586" y="166" text-anchor="middle" font-size="10" fill="#141414">MCP</text>
  <!-- Xilo -> Azkena (MCP, request) -->
  <line x1="440" y1="246" x2="470" y2="246" stroke="#141414" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="438" y="224" width="34" height="16" rx="3" fill="#f7f4ef"/>
  <text x="455" y="236" text-anchor="middle" font-size="10" fill="#141414">MCP</text>
  <!-- Azkena -> Frontis (GraphQL, request) -->
  <line x1="660" y1="246" x2="690" y2="246" stroke="#141414" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="642" y="224" width="66" height="16" rx="3" fill="#f7f4ef"/>
  <text x="675" y="236" text-anchor="middle" font-size="10" fill="#141414">GraphQL</text>
  <!-- Xilo -> Queues (produce, async) -->
  <line x1="331" y1="288" x2="331" y2="328" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <rect x="277" y="300" width="54" height="15" rx="3" fill="#f7f4ef"/>
  <text x="304" y="311" text-anchor="middle" font-size="10" fill="#7a7a7a">produce</text>
  <!-- Queues -> Xilo (consume, async) -->
  <line x1="359" y1="328" x2="359" y2="288" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <rect x="359" y="300" width="56" height="15" rx="3" fill="#f7f4ef"/>
  <text x="387" y="311" text-anchor="middle" font-size="10" fill="#7a7a7a">consume</text>
  <!-- Frontis -> subgraphs (federation routing) -->
  <path d="M 700,288 C 700,308 520,308 520,328" stroke="#7a7a7a" stroke-width="1.2" fill="none" marker-end="url(#arr-muted)"/>
  <path d="M 750,288 C 750,308 638,308 638,328" stroke="#7a7a7a" stroke-width="1.2" fill="none" marker-end="url(#arr-muted)"/>
  <path d="M 800,288 C 800,308 756,308 756,328" stroke="#7a7a7a" stroke-width="1.2" fill="none" marker-end="url(#arr-muted)"/>
  <path d="M 850,288 C 850,308 874,308 874,328" stroke="#7a7a7a" stroke-width="1.2" fill="none" marker-end="url(#arr-muted)"/>
  <path d="M 900,288 C 900,308 992,308 992,328" stroke="#7a7a7a" stroke-width="1.2" fill="none" marker-end="url(#arr-muted)"/>
  <path d="M 950,288 C 950,308 1110,308 1110,328" stroke="#7a7a7a" stroke-width="1.2" fill="none" marker-end="url(#arr-muted)"/>
  <rect x="806" y="300" width="70" height="15" rx="3" fill="#f7f4ef"/>
  <text x="841" y="311" text-anchor="middle" font-size="10" fill="#7a7a7a">federation</text>
  <!-- subgraphs -> D1 (binding, async) -->
  <path d="M 638,400 C 638,419 700,419 700,438" stroke="#7a7a7a" stroke-width="1.1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <path d="M 756,400 C 756,419 700,419 700,438" stroke="#7a7a7a" stroke-width="1.1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <path d="M 874,400 C 874,419 700,419 700,438" stroke="#7a7a7a" stroke-width="1.1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <path d="M 992,400 C 992,419 700,419 700,438" stroke="#7a7a7a" stroke-width="1.1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <path d="M 1110,400 C 1110,419 700,419 700,438" stroke="#7a7a7a" stroke-width="1.1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>

  <!-- ===== LEGEND ===== -->
  <rect x="20" y="544" width="1160" height="44" rx="6" fill="#fffdfc" stroke="#e5ded6" stroke-width="1"/>
  <rect x="40" y="559" width="14" height="14" rx="3" fill="#c8102e" fill-opacity="0.08" stroke="#c8102e" stroke-width="1.2"/>
  <text x="62" y="570" font-size="11" fill="#262626">Gateway (focal)</text>
  <line x1="210" y1="566" x2="246" y2="566" stroke="#141414" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <text x="254" y="570" font-size="11" fill="#262626">Request (webhook · MCP · GraphQL)</text>
  <line x1="560" y1="566" x2="596" y2="566" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#arr-muted)"/>
  <text x="604" y="570" font-size="11" fill="#262626">Federation routing</text>
  <line x1="770" y1="566" x2="806" y2="566" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-muted)"/>
  <text x="814" y="570" font-size="11" fill="#262626">Async · binding (queue · D1)</text>
</svg>
